[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bind-time-authority-fabric"
version = "1.0.1"
description = "Deterministic bind-time authority enforcement fabric"
authors = [{ name = "Samantha Revita" }]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "pynacl"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["bind_time_authority_fabric*"]
