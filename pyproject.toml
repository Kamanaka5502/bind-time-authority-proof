[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bind-time-authority-fabric"
version = "1.0.2"
description = "Protected bind-time authority proof surface for consequence-boundary evaluation"
authors = [{ name = "Samantha Revita" }]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary / Restricted Use" }
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["bind_time_authority_fabric*"]
